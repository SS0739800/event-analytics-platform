<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Four cells from the activity heatmap, in its own warm ramp. Kept to 2x2
       because a 3x3 turns to mush at 16px, which is the size that matters. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <rect x="7"  y="7"  width="8" height="8" rx="1.5" fill="#efa87d"/>
  <rect x="17" y="7"  width="8" height="8" rx="1.5" fill="#b4471a"/>
  <rect x="7"  y="17" width="8" height="8" rx="1.5" fill="#f4c4a5"/>
  <rect x="17" y="17" width="8" height="8" rx="1.5" fill="#d9713a"/>
</svg>
